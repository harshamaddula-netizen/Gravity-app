version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: truthlens-backend
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEMO_MODE=true
      - MIN_EVIDENCE_SCORE=0.55
      - MIN_RELEVANT_SOURCES=1
      - LLM_PROVIDER=demo
    ports:
      - "8000:8000"
    volumes:
      - ./truthlens.db:/app/backend/truthlens.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: truthlens-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
